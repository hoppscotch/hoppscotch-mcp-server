name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  # Required for `pnpm publish --provenance` (OIDC-signed SLSA attestation).
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Bind the publish to the `release` environment so its reviewer rule and
    # environment-scoped NPM_TOKEN apply (an unconfigured environment gates nothing).
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A matching version tag must identify a commit already reachable from
      # main. This prevents a tag on an unmerged branch from publishing.
      - name: Verify release commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Release tag must point to a commit reachable from main."
            exit 1
          fi

      # Reads the pinned version from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          SRV_VERSION=$(node -p "require('./server.json').version")
          SRV_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          if [ "$SRV_VERSION" != "$PKG_VERSION" ] || [ "$SRV_PKG_VERSION" != "$PKG_VERSION" ]; then
            echo "server.json versions ($SRV_VERSION / $SRV_PKG_VERSION) do not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release gate before any publish: the typecheck, lint, test and audit checks
      # ci.yml runs on main (ci.yml additionally covers formatting and the OS/Node
      # matrix, so tag only a commit main CI has passed).
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      # The Cloud Firebase Web API key is baked into the bundle at build time
      # (tsup `define`) rather than hardcoded in source. Without it the published
      # package would fail every Cloud sign-in, so fail before building.
      # The changelog is a release source of truth (CONTRIBUTING.md, Releasing): the tagged
      # version must have a matching section before anything publishes.
      - name: Verify changelog section
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "^## \[${PKG_VERSION//./\.}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no \"## [$PKG_VERSION]\" section."
            exit 1
          fi

      - name: Verify release secrets
        env:
          HOPPSCOTCH_FIREBASE_API_KEY: ${{ secrets.HOPPSCOTCH_FIREBASE_API_KEY }}
        run: |
          if [ -z "$(printf '%s' "$HOPPSCOTCH_FIREBASE_API_KEY" | tr -d '[:space:]')" ]; then
            echo "HOPPSCOTCH_FIREBASE_API_KEY secret (release environment or repository) is not set (or is blank)."
            echo "Publishing without it would ship a build whose Cloud sign-in always fails."
            exit 1
          fi

      - name: Build
        env:
          HOPPSCOTCH_FIREBASE_API_KEY: ${{ secrets.HOPPSCOTCH_FIREBASE_API_KEY }}
        run: pnpm run build

      # Mirrors ci.yml's build-output gate so a tag push can't publish an empty
      # or mis-targeted build.
      - name: Check build output
        run: |
          test -f dist/index.js || exit 1

      # --provenance attaches a signed SLSA provenance attestation to the
      # published tarball, letting downstream consumers verify the package was
      # built from this repo at this commit. Requires id-token: write (see
      # permissions above). --no-git-checks: the tag-triggered checkout is
      # detached, which pnpm's default publish git-check would reject.
      # --ignore-scripts: publish the dist built in the step above (Firebase key
      # baked in) exactly as verified; without it, `pnpm publish` re-runs the
      # `prepare` build with no key env and would ship an empty-key bundle.
      - name: Publish to npm with provenance
        run: pnpm publish --access public --provenance --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
